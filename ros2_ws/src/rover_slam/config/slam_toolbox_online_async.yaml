# slam_toolbox (Jazzy) online-async mapping for the MISSION X rover.
#
# LiDAR: ROBOTIS LDS-01 (HLS-LFCD2): 360 beams (1 deg), 5 Hz, 0.12-3.5 m,
# mounted on a mast ~0.62 m above the ground (laser_link).
#
# "hector_like" note - the ROS 1 rover used hector_slam, which is NOT ported to
# ROS 2. slam_toolbox replaces it. Differences that matter here:
#   * hector_slam needed no odometry (pure scan matching at high scan rates);
#     slam_toolbox expects odom -> base_footprint, provided by the
#     robot_localization EKF (wheel odometry + MPU-6050 gyro). This is much more
#     robust with a 5 Hz, 3.5 m LiDAR in feature-poor rooms.
#   * scan matching is still the main source of the map->odom correction; the
#     small search windows below behave "hector-like" (trust the scan matcher,
#     update often: minimum_travel_* are small) while loop closure (absent in
#     hector) removes drift when the rover revisits a place.
#   * map saving: `ros2 run nav2_map_server map_saver_cli -f <name>` (or the
#     slam_toolbox RViz panel / serialize service for continuing a session).

slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping              # localization: reuse a serialized posegraph

    debug_logging: false
    throttle_scans: 1          # LDS-01 is only 5 Hz: use every scan
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    min_laser_range: 0.12      # LDS-01 datasheet
    max_laser_range: 3.5
    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.2     # short-range LiDAR: add nodes often
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 3.5
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure correlation parameters
    loop_search_space_dimension: 6.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
