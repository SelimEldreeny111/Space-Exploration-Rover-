# LiDAR-visible map of rover_sim/worlds/lab.yaml (obstacles >= 0.60 m), generated by
# rover_sim/scripts/make_lab_world.py. Frame: map = rover start pose (like a slam_toolbox map),
# so AMCL starts at (0, 0, 0). Crates and chair seats are NOT in this map.
image: lab.pgm
mode: trinary
resolution: 0.05
origin: [-1.300, -1.900, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
